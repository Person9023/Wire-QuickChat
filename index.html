<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1c1a16; --ink-dim: #6f6a5f;
    --line: #e4dfd3; --bubble-them: #ffffff; --bubble-me: #2b2a26;
    --bubble-me-ink: #f6f4ef; --accent: #b5451b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141310; --panel: #1c1b17; --ink: #efece3; --ink-dim: #948e7e;
      --line: #2d2b25; --bubble-them: #24221d; --bubble-me: #efece3;
      --bubble-me-ink: #17160f; --accent: #e2734a;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    display: flex; flex-direction: column;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header h1 { font-size: 19px; font-weight: 600; margin: 0; cursor: pointer; }
  header .right { display: flex; align-items: center; gap: 8px; }
  .status { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .iconbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim);
    font-family: ui-monospace, monospace; font-size: 11px; padding: 6px 10px;
    border-radius: 10px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--ink); }

  main { flex: 1; overflow-y: auto; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 2px; }
  .empty { margin: auto; text-align: center; color: var(--ink-dim); font-size: 14px; max-width: 260px; line-height: 1.6; }

  .row { display: flex; margin: 3px 0; }
  .row.me { justify-content: flex-end; }
  .row.them { justify-content: flex-start; }
  .bubble {
    max-width: 74%; padding: 9px 13px; border-radius: 16px; font-size: 15px;
    line-height: 1.42; word-wrap: break-word; white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  }
  .row.them .bubble { background: var(--bubble-them); border: 1px solid var(--line); border-left: 3px solid var(--sender-color, var(--line)); border-bottom-left-radius: 4px; }
  .row.me .bubble { background: var(--bubble-me); color: var(--bubble-me-ink); border-bottom-right-radius: 4px; }
  .meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-dim); margin: 10px 4px 3px; }
  .meta.me { text-align: right; }
  .meta .sender { color: var(--sender-color, var(--ink-dim)); font-weight: 600; }

  footer {
    position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  form { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 6px 6px 14px; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.4; max-height: 120px; padding: 6px 0;
  }
  textarea::placeholder { color: var(--ink-dim); }
  button.send {
    border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.03em; padding: 10px 16px; border-radius: 14px; cursor: pointer; flex-shrink: 0;
  }
  button.send:disabled { opacity: 0.4; cursor: default; }

  /* full-screen views */
  .view {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: none; flex-direction: column;
  }
  .view.active { display: flex; }
  .view-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    max-width: 360px; width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px 24px; text-align: center;
  }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .card p { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 18px; }
  .card input {
    width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-family: inherit; font-size: 15px; margin-bottom: 12px; outline: none;
  }
  .card input:focus { border-color: var(--accent); }
  .card button.primary {
    width: 100%; border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12.5px; letter-spacing: 0.03em; padding: 12px; border-radius: 12px; cursor: pointer;
  }
  .card .switch {
    margin-top: 14px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; text-decoration: underline;
  }
  .card .errormsg { color: var(--accent); font-size: 12.5px; margin: -6px 0 12px; min-height: 1em; }

  /* room list view */
  .rooms-wrap { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .roomlist { display: flex; flex-direction: column; gap: 8px; max-width: 480px; margin: 0 auto; }
  .roomcard {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; cursor: pointer;
  }
  .roomcard:hover { border-color: var(--accent); }
  .roomcard-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .roomcard .name { font-size: 15.5px; font-weight: 600; }
  .roomcard .sub { font-size: 11px; color: var(--ink-dim); font-family: ui-monospace, monospace; margin-top: 2px; }
  .roomlist .emptyrooms { text-align: center; color: var(--ink-dim); font-size: 13.5px; padding: 30px 10px; }
  .newroom-row { display: flex; gap: 8px; max-width: 480px; margin: 0 auto 16px; padding: 16px 16px 0; }
  .newroom-row input {
    flex: 1; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-family: inherit; font-size: 14.5px; outline: none;
  }
  .newroom-row input:focus { border-color: var(--accent); }
  .newroom-row button {
    border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12px; padding: 0 16px; border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  .join-row { max-width: 480px; margin: 10px auto 0; padding: 0 16px; text-align: center; }
  .join-row a { color: var(--ink-dim); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .joinbox-row { display: flex; gap: 8px; max-width: 480px; margin: 6px auto 0; padding: 0 16px; }
  .joinbox-row input {
    flex: 1; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-dim); font-family: ui-monospace, monospace; font-size: 12.5px; outline: none;
  }
  .joinbox-row input:focus { border-color: var(--accent); color: var(--ink); }
  .joinbox-row button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim); font-family: ui-monospace, monospace;
    font-size: 11px; padding: 0 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  .joinbox-error { max-width: 480px; margin: 4px auto 0; padding: 0 16px; font-size: 11.5px; color: var(--accent); text-align: center; min-height: 1em; }
  .system-line { text-align: center; font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-dim); margin: 12px 4px; }

  .attachbtn {
    border: none; background: transparent; color: var(--ink-dim); font-size: 22px;
    width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; line-height: 1;
  }
  .attachbtn:hover { color: var(--accent); background: var(--bg); }
  .attachbtn:disabled { opacity: 0.4; cursor: default; }
  .attach-wrap { position: relative; }
  .attach-menu {
    position: absolute; bottom: 42px; left: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; display: none; flex-direction: column; gap: 2px; min-width: 170px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.14); z-index: 15;
  }
  .attach-menu.open { display: flex; }
  .attach-menu-item {
    border: none; background: transparent; text-align: left; padding: 9px 11px; border-radius: 8px;
    font-family: inherit; font-size: 14px; color: var(--ink); cursor: pointer;
  }
  .attach-menu-item:hover { background: var(--bg); }
  .bubble.imgbubble { padding: 4px; max-width: 68%; }
  .bubble.imgbubble img {
    display: block; width: 100%; max-height: 320px; object-fit: cover;
    border-radius: 12px; cursor: pointer;
  }
  .bubble.audiobubble { display: flex; flex-direction: column; gap: 6px; max-width: 82%; }
  .audio-filename { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-dim); word-break: break-all; }
  .audio-loading { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-dim); }
  .bubble.audiobubble audio { width: 230px; max-width: 100%; }
  .pinbar {
    position: sticky; top: 0; z-index: 4; display: none; align-items: center; gap: 8px;
    min-height: 34px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    color: var(--ink); font-size: 12px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .pinbar.show { display: flex; }
  .pinbar-label { font-family: ui-monospace, monospace; font-size: 10px; color: var(--accent); font-weight: 700; flex-shrink: 0; }
  .pinbar-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--ink-dim); }
  .row.pinned .bubble { box-shadow: 0 0 0 2px var(--accent); }
  .message-menu {
    position: fixed; z-index: 30; display: none; min-width: 125px; padding: 5px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }
  .message-menu.open { display: block; }
  .message-menu button {
    width: 100%; border: none; background: transparent; color: var(--ink); text-align: left;
    padding: 8px 10px; border-radius: 7px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .message-menu button:hover { background: var(--bg); }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- AUTH VIEW -->
<div class="view active" id="view-auth">
  <div class="view-center">
    <div class="card">
      <h2 id="authTitle">Sign in</h2>
      <p id="authSubtitle">Username and password only — no email. Synced everywhere.</p>
      <div class="errormsg" id="authError"></div>
      <input id="authUsername" type="text" maxlength="24" placeholder="Username" autocomplete="off">
      <input id="authPassword" type="password" maxlength="64" placeholder="Password" autocomplete="off">
      <button class="primary" id="authSubmit">Sign in</button>
      <div class="switch" id="authSwitch">New here? Create an account</div>
    </div>
  </div>
</div>

<!-- ROOM LIST VIEW -->
<div class="view" id="view-rooms">
  <header>
    <h1>Wire</h1>
    <div class="right">
      <span class="status" id="whoami"></span>
      <button class="iconbtn" id="notifyBtn">🔔 off</button>
      <button class="iconbtn" id="logoutBtn">log out</button>
    </div>
  </header>
  <div class="newroom-row">
    <input id="newRoomName" type="text" maxlength="40" placeholder="Name a new room…" autocomplete="off">
    <button id="createRoomBtn">Create</button>
  </div>
  <div class="rooms-wrap">
    <div class="roomlist" id="roomList"></div>
  </div>
  <div class="join-row"><a id="pendingJoinLink" style="display:none;">Join the room from your link</a></div>
  <div class="joinbox-row">
    <input id="joinCodeInput" type="text" placeholder="Paste a Wire link or room code…" autocomplete="off">
    <button id="joinCodeBtn">Join</button>
  </div>
  <div class="joinbox-error" id="joinCodeError"></div>
</div>

<!-- CHAT VIEW -->
<div class="view" id="view-chat">
  <header>
    <h1 id="chatBack" title="Back to your rooms">Wire</h1>
    <div class="right">
      <span class="status" id="status">—</span>
      <button class="iconbtn" id="pinModeBtn">pin message</button>
      <button class="iconbtn" id="shareBtn">copy link</button>
    </div>
  </header>
  <div class="pinbar" id="pinBar">
    <span class="pinbar-label">PINNED</span><span class="pinbar-text" id="pinBarText"></span>
  </div>
  <main id="thread">
    <div class="empty" id="emptyState">No messages yet — say something.</div>
  </main>
  <div class="message-menu" id="messageMenu"><button id="pinMessageBtn">Pin message</button></div>
  <footer>
    <form id="composer">
      <div class="attach-wrap">
        <button type="button" class="attachbtn" id="attachBtn" title="Add attachment">+</button>
        <div class="attach-menu" id="attachMenu">
          <button type="button" class="attach-menu-item" id="attachImageOption">🖼 Image</button>
          <button type="button" class="attach-menu-item" id="attachAudioOption">🎵 Audio / voice clip</button>
        </div>
      </div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <input type="file" id="audioInput" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" style="display:none;">
      <textarea id="input" rows="1" placeholder="Message" maxlength="2000"></textarea>
      <button class="send" id="send" type="submit">send</button>
    </form>
  </footer>
</div>

<script>
(function () {
  // ---------- Firebase (accounts, room names, and now messages too — all synced, all persistent) ----------
  firebase.initializeApp({
    apiKey: "AIzaSyDCcaLRE6uUmeXpXT60SzagWmCrSn2I1Xc",
    authDomain: "wire-quickchat.firebaseapp.com",
    projectId: "wire-quickchat",
    storageBucket: "wire-quickchat.firebasestorage.app",
    messagingSenderId: "356713301537",
    appId: "1:356713301537:web:4016542978dfd158c68560"
  });
  const firestoreDb = firebase.firestore();
  const accountsCol = firestoreDb.collection('wire-accounts');
  const roomsCol = firestoreDb.collection('wire-rooms');
  const FieldValue = firebase.firestore.FieldValue;
  const IMAGE_BYTE_BUDGET = 700000; // encoded-image ceiling; safely under Firestore's 1MB document cap
  const CHUNK_BUDGET = 450000; // keep chunk documents comfortably below Firestore's 1MB document limit
  const MAX_AUDIO_BYTES = 16 * 1024 * 1024; // raw upload cap before compression

  async function hashPassword(pw) {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---------- state ----------
  let currentUser = null;
  let pendingTopicFromLink = getTopicFromHash();

  function getTopicFromHash() {
    const h = location.hash.replace('#', '').trim();
    return h.length > 0 ? h : null;
  }
  function randomTopic() {
    return 'wire-' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
  }

  // ---------- view switching ----------
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------- AUTH VIEW ----------
  let authMode = 'signin';
  const authTitle = document.getElementById('authTitle');
  const authSwitch = document.getElementById('authSwitch');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');

  function setAuthMode(mode) {
    authMode = mode;
    authError.textContent = '';
    if (mode === 'signin') {
      authTitle.textContent = 'Sign in';
      authSubmit.textContent = 'Sign in';
      authSwitch.textContent = 'New here? Create an account';
    } else {
      authTitle.textContent = 'Create account';
      authSubmit.textContent = 'Create account';
      authSwitch.textContent = 'Already have an account? Sign in';
    }
  }
  authSwitch.addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'create' : 'signin'));

  authSubmit.addEventListener('click', async () => {
    const username = authUsername.value.trim();
    const password = authPassword.value;
    authError.textContent = '';
    if (!username || !password) {
      authError.textContent = 'Enter a username and password.';
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = authMode === 'create' ? 'Creating…' : 'Signing in…';
    try {
      const hash = await hashPassword(password);
      const ref = accountsCol.doc(username);
      const snap = await ref.get();
      if (authMode === 'create') {
        if (snap.exists) { authError.textContent = 'That username is already taken.'; return; }
        await ref.set({ passwordHash: hash, rooms: [] });
        currentUser = username;
        enterRoomsView();
      } else {
        if (!snap.exists || snap.data().passwordHash !== hash) { authError.textContent = 'Wrong username or password.'; return; }
        currentUser = username;
        enterRoomsView();
      }
    } catch (e) {
      authError.textContent = 'Could not reach the database — check your connection and try again.';
    } finally {
      authSubmit.disabled = false;
      setAuthMode(authMode);
    }
  });
  authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmit.click(); });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (roomsUnsub) { roomsUnsub(); roomsUnsub = null; }
    Object.values(notifyUnsubs).forEach(fn => fn());
    notifyUnsubs = {};
    currentUser = null;
    myRoomsCache = [];
    authUsername.value = '';
    authPassword.value = '';
    setAuthMode('signin');
    showView('view-auth');
  });

  // ---------- ROOM LIST VIEW ----------
  const whoamiEl = document.getElementById('whoami');
  const roomListEl = document.getElementById('roomList');
  const newRoomNameEl = document.getElementById('newRoomName');
  const pendingJoinLinkEl = document.getElementById('pendingJoinLink');

  let roomsUnsub = null;
  let myRoomsCache = [];

  function getMyRooms() { return myRoomsCache; }

  async function refreshRoomMetadata(roomEntries) {
    const entries = Array.isArray(roomEntries) ? roomEntries : [];
    const enriched = await Promise.all(entries.map(async (r) => {
      if (!r || !r.id) return r;
      try {
        const snap = await roomsCol.doc(r.id).get();
        if (snap.exists) {
          const data = snap.data() || {};
          return {
            id: r.id,
            name: data.name || r.name || r.id,
            creator: data.creator || r.creator || null
          };
        }
      } catch (e) {}
      return {
        id: r.id,
        name: r.name || r.id,
        creator: r.creator || null
      };
    }));
    return enriched.filter(Boolean);
  }

  function subscribeRooms() {
    if (roomsUnsub) { roomsUnsub(); roomsUnsub = null; }
    roomsUnsub = accountsCol.doc(currentUser).onSnapshot(async (snap) => {
      const rawRooms = (snap.exists && snap.data().rooms) || [];
      myRoomsCache = await refreshRoomMetadata(rawRooms);
      renderRoomList();
      resubscribeNotifyListeners();
    }, () => {});
  }

  // ---------- notifications (foreground only — see note to the user) ----------
  const notifyBtn = document.getElementById('notifyBtn');
  let notificationsEnabled = false;
  let notifyUnsubs = {}; // topic -> unsubscribe fn

  function updateNotifBtn() {
    if (!('Notification' in window)) { notifyBtn.textContent = '🔔 n/a'; notifyBtn.disabled = true; return; }
    if (Notification.permission === 'denied') { notifyBtn.textContent = '🔔 blocked'; return; }
    notifyBtn.textContent = notificationsEnabled ? '🔔 on' : '🔔 off';
  }

  function resubscribeNotifyListeners() {
    const currentIds = new Set(myRoomsCache.map(r => r.id));
    Object.keys(notifyUnsubs).forEach((id) => {
      if (!currentIds.has(id)) { notifyUnsubs[id](); delete notifyUnsubs[id]; }
    });
    if (!notificationsEnabled) return;
    myRoomsCache.forEach((r) => {
      if (notifyUnsubs[r.id]) return;
      let firstFire = true;
      notifyUnsubs[r.id] = roomsCol.doc(r.id).collection('messages').orderBy('ts', 'desc').limit(1)
        .onSnapshot((snap) => {
          if (firstFire) { firstFire = false; return; } // don't notify for history on subscribe
          snap.docChanges().forEach((change) => {
            if (change.type !== 'added') return;
            const data = change.doc.data();
            if (data.sender === currentUser) return;
            const alreadyOpen = document.getElementById('view-chat').classList.contains('active') && topic === r.id;
            if (alreadyOpen) return;
            let body = data.text || 'New message';
            if (data.type === 'image') body = '📷 sent a photo';
            if (data.type === 'audio') body = '🎵 sent an audio clip';
            if (data.type === 'join') return;
            try { new Notification(r.name + ' · ' + data.sender, { body: body }); } catch (e) {}
          });
        }, () => {});
    });
  }

  notifyBtn.addEventListener('click', async () => {
    if (!('Notification' in window)) return;
    if (notificationsEnabled) {
      notificationsEnabled = false;
      localStorage.setItem('wire-notify-pref', '0');
      Object.values(notifyUnsubs).forEach(fn => fn());
      notifyUnsubs = {};
      updateNotifBtn();
      return;
    }
    if (Notification.permission === 'denied') {
      window.alert('Notifications are blocked for this site in your browser settings — enable them there, then try again.');
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { updateNotifBtn(); return; }
    notificationsEnabled = true;
    localStorage.setItem('wire-notify-pref', '1');
    updateNotifBtn();
    resubscribeNotifyListeners();
  });

  // restore preference on load, without re-prompting if permission is already settled
  if (('Notification' in window) && localStorage.getItem('wire-notify-pref') === '1' && Notification.permission === 'granted') {
    notificationsEnabled = true;
  }
  updateNotifBtn();

  async function addRoomToMyList(topic, name, creator) {
    if (myRoomsCache.some(r => r.id === topic)) return;
    try {
      await accountsCol.doc(currentUser).update({
        rooms: FieldValue.arrayUnion({
          id: topic,
          name: name || topic,
          creator: creator || null
        })
      });
    } catch (e) {}
  }

  async function deleteRoom(roomId) {
    const roomRef = roomsCol.doc(roomId);

    // Delete all message documents and their audio chunk subcollections.
    const messagesSnap = await roomRef.collection('messages').get();
    for (const messageDoc of messagesSnap.docs) {
      const chunksSnap = await messageDoc.ref.collection('chunks').get();
      if (!chunksSnap.empty) {
        const chunkDocs = chunksSnap.docs;
        for (let i = 0; i < chunkDocs.length; i += 400) {
          const batch = firestoreDb.batch();
          chunkDocs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
          await batch.commit();
        }
      }
      await messageDoc.ref.delete();
    }

    // Delete the room itself.
    await roomRef.delete();

    // Remove it from the account that requested deletion.
    // DuckedOUT99 can also delete legacy rooms created before the
    // creator field existed, so the room is removed from that account too.
    const accountRef = accountsCol.doc(currentUser);
    const accountSnap = await accountRef.get();
    if (accountSnap.exists) {
      const rooms = accountSnap.data().rooms || [];
      await accountRef.update({
        rooms: rooms.filter(r => r.id !== roomId)
      });
    }

    // If DuckedOUT99 deleted a legacy room, also remove that room from
    // the old creator's room list when that information is available.
    if (currentUser === 'DuckedOUT99') {
      const allAccounts = await accountsCol.get();
      const cleanupPromises = [];
      allAccounts.forEach(accountDoc => {
        if (accountDoc.id === currentUser) return;
        const rooms = accountDoc.data().rooms || [];
        if (rooms.some(r => r.id === roomId)) {
          cleanupPromises.push(
            accountDoc.ref.update({
              rooms: rooms.filter(r => r.id !== roomId)
            })
          );
        }
      });
      await Promise.all(cleanupPromises);
    }

    // Stop notifications for the deleted room immediately.
    if (notifyUnsubs[roomId]) {
      notifyUnsubs[roomId]();
      delete notifyUnsubs[roomId];
    }
  }

  function updatePinBar() {
    const pinBar = document.getElementById('pinBar');
    const pinText = document.getElementById('pinBarText');

    const pinned = getPinnedIds().filter(id => messageNodes.has(id));

    if (!pinned.length) {
      pinBar.classList.remove('show');
      pinBarTargetId = null;
      return;
    }

    const mainRect = threadEl.getBoundingClientRect();

    // Find the pinned message currently being viewed, or the first pinned
    // message at/below the top of the viewport. The target is the closest
    // pinned message that is older than that one.
    let referenceIndex = -1;
    for (let i = 0; i < pinned.length; i++) {
      const rect = messageNodes.get(pinned[i]).getBoundingClientRect();
      if (rect.bottom >= mainRect.top && rect.top <= mainRect.bottom) {
        referenceIndex = i;
        break;
      }
    }

    if (referenceIndex === -1) {
      for (let i = 0; i < pinned.length; i++) {
        const rect = messageNodes.get(pinned[i]).getBoundingClientRect();
        if (rect.top >= mainRect.top) {
          referenceIndex = i;
          break;
        }
      }
    }

    if (referenceIndex === -1) referenceIndex = pinned.length;

    // pinned[] is oldest -> youngest, so the previous entry is the
    // youngest message that is still older than the reference.
    let targetIndex = referenceIndex - 1;
    if (targetIndex < 0) targetIndex = pinned.length - 1;

    // If the reference itself is already the oldest, use the youngest pin
    // as the wrap-around target.
    pinBarTargetId = pinned[targetIndex];
    pinText.textContent = messagePreview(messageData.get(pinBarTargetId));
    pinBar.classList.add('show');
  }

  function readFileAsImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Images are deliberately kept small because they live directly inside Firestore
  // message documents. WebP usually gives much smaller files than JPEG at similar
  // visual quality, while the 1024px maximum dimension keeps phone photos cheap.
  //
  // Target: roughly 180–220 KB per image in normal cases.
  const IMAGE_TARGET_BYTES = 220000;

  function canvasToDataUrl(canvas, type, quality) {
    const dataUrl = canvas.toDataURL(type, quality);
    // Fall back to JPEG if WebP encoding is unavailable.
    return (type === 'image/webp' && !dataUrl.startsWith('data:image/webp'))
      ? canvas.toDataURL('image/jpeg', quality)
      : dataUrl;
  }

  function compressImage(img, maxDim, quality, type) {
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));

    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    return canvasToDataUrl(canvas, type, quality);
  }

  async function makeCompactImage(img) {
    // WebP is tried first because it normally gives much better compression.
    // JPEG is the compatibility fallback.
    for (const type of ['image/webp', 'image/jpeg']) {
      for (const maxDim of [1024, 900, 800, 700, 600]) {
        let best = null;
        let low = 0.30;
        let high = 0.78;

        // Seven iterations are enough to get very close to the largest
        // quality that still fits the target size.
        for (let i = 0; i < 7; i++) {
          const quality = (low + high) / 2;
          const candidate = compressImage(img, maxDim, quality, type);

          if (candidate.length <= IMAGE_TARGET_BYTES) {
            best = candidate;
            low = quality;
          } else {
            high = quality;
          }
        }

        if (best) return best;
      }
    }

    // Final safety fallback for unusually difficult images.
    return compressImage(img, 512, 0.28, 'image/jpeg');
  }

  async function sendImage(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) {

    try {

      const dataUrl = await makeCompactImage(img);

      // Data URLs contain base64, so the string is larger than the binary file.
      // Keep the existing Firestore safety margin.
      if (!dataUrl || dataUrl.length > IMAGE_BYTE_BUDGET) {
        setStatus('image could not be compressed enough');
        return;
      }

      const approxKB = Math.round((dataUrl.length * 3) / 4 / 1024);
      setStatus('sending image (' + approxKB + ' KB)…');

      await roomsCol.doc(topic).collection('messages').add({
        type: 'image',

  // Audio is aggressively converted to mono Opus/WebM in the browser before
  // it is sent. This is dramatically smaller than storing the original WAV,
  // FLAC or high-bitrate recording. Chrome/Edge support this conversion natively.
  // If conversion is unavailable, we fall back to the original file.
  const AUDIO_BITRATE = 24000; // 24 kbps is plenty for voice/chat audio
  const AUDIO_SAMPLE_RATE = 24000;

  function blobToDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async function compressAudio(file) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx || !window.MediaRecorder) return { blob: file, mimeType: file.type || 'audio/mpeg' };

    let audioCtx = null;
    let source = null;
    let stream = null;
    let recorder = null;

    try {
      const arrayBuffer = await file.arrayBuffer();
      audioCtx = new AudioCtx();
      const decoded = await audioCtx.decodeAudioData(arrayBuffer.slice(0));

      // Mix every source channel down to mono. This cuts the audio payload
      // roughly in half before the low-bitrate Opus encoder gets to work.
      const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * AUDIO_SAMPLE_RATE)), AUDIO_SAMPLE_RATE);
      source = offline.createBufferSource();
      source.buffer = decoded;
      source.connect(offline.destination);
      source.start(0);
      const monoBuffer = await offline.startRendering();

      // Feed the resampled mono audio into MediaRecorder so the browser's
      // native Opus encoder can produce a compact WebM file.
      const renderCtx = new AudioCtx({ sampleRate: AUDIO_SAMPLE_RATE });
      const destination = renderCtx.createMediaStreamDestination();
      const playback = renderCtx.createBufferSource();
      playback.buffer = monoBuffer;
      playback.connect(destination);

      let mimeType = '';
      for (const candidate of ['audio/webm;codecs=opus', 'audio/webm']) {
        if (MediaRecorder.isTypeSupported(candidate)) { mimeType = candidate; break; }
      }
      if (!mimeType) {
        renderCtx.close();
        return { blob: file, mimeType: file.type || 'audio/mpeg' };
      }

      const parts = [];
      recorder = new MediaRecorder(destination.stream, { mimeType, audioBitsPerSecond: AUDIO_BITRATE });
      const finished = new Promise((resolve, reject) => {
        recorder.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
        recorder.onerror = () => reject(recorder.error || new Error('audio encoder failed'));
        recorder.onstop = () => resolve();
      });

      playback.onended = () => recorder.stop();
      recorder.start(1000);
      playback.start(0);
      await finished;
      renderCtx.close();

      const blob = new Blob(parts, { type: mimeType.split(';')[0] });
      if (!blob.size || blob.size >= file.size * 0.95) {
        return { blob: file, mimeType: file.type || 'audio/mpeg' };
      }
      return { blob, mimeType: 'audio/webm' };
    } finally {
      try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch (e) {}
      try { if (audioCtx) await audioCtx.close(); } catch (e) {}
      if (stream) stream.getTracks().forEach(t => t.stop());
    }
  }

  async function sendAudio(file) {
    if (!file) return;
    const looksLikeAudio = (file.type && file.type.indexOf('audio/') === 0) ||
      /\.(mp3|m4a|wav|ogg|aac|flac|webm)$/i.test(file.name || '');
    if (!looksLikeAudio) { setStatus('that\'s not an audio file'); return; }
    if (file.size > MAX_AUDIO_BYTES) { setStatus('audio too big (max 16MB)'); return; }

    attachBtn.disabled = true;
    sendBtn.disabled = true;
    setStatus('compressing audio…');
    try {
      const result = await compressAudio(file);
      const dataUrl = await blobToDataUrl(result.blob);
      const chunks = [];
      for (let i = 0; i < dataUrl.length; i += CHUNK_BUDGET) {
        chunks.push(dataUrl.slice(i, i + CHUNK_BUDGET));
      }

      setStatus('sending audio…');
      const msgRef = await roomsCol.doc(topic).collection('messages').add({
        type: 'audio',
        sender: currentUser,
        fileName: file.name,
        mimeType: result.mimeType,
        totalChunks: chunks.length,
        compressedBytes: result.blob.size,
        ts: FieldValue.serverTimestamp()
      });

      // Sequential writes avoid hammering Firestore with a large burst of
      // chunk writes and make failures easier to recover from.
      for (let i = 0; i < chunks.length; i++) {
        await msgRef.collection('chunks').doc(String(i)).set({ data: chunks[i] });
      }
      setStatus('live');
    } catch (e) {
      console.error('audio upload failed', e);
      setStatus('audio upload failed');
    } finally {
      attachBtn.disabled = false;
      sendBtn.disabled = false;
      audioInput.value = '';
    }
  }
  audioInput.addEventListener('change', () => sendAudio(audioInput.files && audioInput.files[0]));

  async function loadAudioChunks(msgId, expectedChunks = 0, mimeType = 'audio/webm') {
    const chunksRef = roomsCol.doc(topic).collection('messages').doc(msgId).collection('chunks');

    // Uploading creates the message first and the chunk documents afterwards,
    // so the first read can legitimately happen before all chunks are present.
    // Retry briefly until the complete audio is available.
    let docs = [];
    for (let attempt = 0; attempt < 20; attempt++) {
      const snap = await chunksRef.get();
      docs = snap.docs
        .sort((a, b) => parseInt(a.id, 10) - parseInt(b.id, 10));

      if (!expectedChunks || docs.length >= expectedChunks) break;
      await new Promise(resolve => setTimeout(resolve, 400));
    }

    if (expectedChunks && docs.length < expectedChunks) {
      throw new Error('audio chunks are incomplete');
    }

    const joined = docs.map(d => d.data().data || '').join('');
    if (!joined) throw new Error('audio data is empty');

    // Chunks contain the complete data URL, including its MIME prefix.
    // Keep that prefix intact so the browser knows how to decode the file.
    if (joined.indexOf('data:') === 0) return joined;

    // Fallback for any older messages that may contain raw base64 only.
    return 'data:' + mimeType + ';base64,' + joined;
  }

  async function postJoinMessage(forTopic, sender) {
    try {
      await roomsCol.doc(forTopic).collection('messages').add({
        type: 'join', sender: sender, ts: FieldValue.serverTimestamp()
      });
    } catch (e) {}
  }

  function shareLink() { return location.href.split('#')[0] + '#' + topic; }
  pinModeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    setPinMode(!pinMode);
  });
  shareBtn.addEventListener('click', async () => {
    const link = shareLink();
    try {
      await navigator.clipboard.writeText(link);
      const original = shareBtn.textContent;
      shareBtn.textContent = 'copied';
      setTimeout(() => { shareBtn.textContent = original; }, 1500);
    } catch (e) {
      window.prompt('Copy this link:', link);
    }
  });
  document.getElementById('pinBar').addEventListener('click', () => {
    if (pinBarTargetId) scrollToMessage(pinBarTargetId);
  });
  document.getElementById('pinMessageBtn').addEventListener('click', () => {
    if (selectedMessageId) togglePin(selectedMessageId);
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#messageMenu')) closeMessageMenu();
  });
  threadEl.addEventListener('scroll', updatePinBar, { passive: true });
  window.addEventListener('resize', updatePinBar);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function enterChatView(t, name) {
    if (msgsUnsub) { msgsUnsub(); msgsUnsub = null; }
    topic = t;
    roomName = name || t;
    location.hash = topic;
    renderedIds.clear();
    messageData.clear();
    messageNodes.clear();
    closeMessageMenu();
    setPinMode(false);
    threadEl.querySelectorAll('.row, .meta, .system-line').forEach(n => n.remove());
    emptyEl.style.display = '';
    document.getElementById('chatBack').textContent = roomName;
    setStatus('connecting…');
    showView('view-chat');
    updatePinBar();
    cleanupExpiredMessages();

    msgsUnsub = roomsCol.doc(topic).collection('messages').orderBy('ts', 'asc').limit(500)
      .onSnapshot((snap) => {
        setStatus('live');
        snap.docChanges().forEach((change) => {
          if (change.type === 'added' || change.type === 'modified') renderMessageDoc(change.doc.id, change.doc.data());
          if (change.type === 'removed') {
            renderedIds.delete(change.doc.id);
            messageData.delete(change.doc.id);
            const node = messageNodes.get(change.doc.id);
            if (node) node.remove();
            messageNodes.delete(change.doc.id);
          }
        });
        updatePinBar();
        threadEl.scrollTop = threadEl.scrollHeight;
        cleanupExpiredMessages();
      }, () => setStatus('error'));
  }

  // ---------- boot ----------
  setAuthMode('signin');
  authUsername.focus();
})();
</script>
