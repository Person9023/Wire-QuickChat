<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #ffffff; --ink: #1c1a16; --ink-dim: #6f6a5f;
    --line: #e4dfd3; --bubble-them: #ffffff; --bubble-me: #2b2a26;
    --bubble-me-ink: #f6f4ef; --accent: #b5451b;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141310; --panel: #1c1b17; --ink: #efece3; --ink-dim: #948e7e;
      --line: #2d2b25; --bubble-them: #24221d; --bubble-me: #efece3;
      --bubble-me-ink: #17160f; --accent: #e2734a;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-serif, Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    display: flex; flex-direction: column;
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header h1 { font-size: 19px; font-weight: 600; margin: 0; cursor: pointer; }
  header .right { display: flex; align-items: center; gap: 8px; }
  .status { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
  .iconbtn {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim);
    font-family: ui-monospace, monospace; font-size: 11px; padding: 6px 10px;
    border-radius: 10px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--ink); }

  main { flex: 1; overflow-y: auto; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 2px; }
  .empty { margin: auto; text-align: center; color: var(--ink-dim); font-size: 14px; max-width: 260px; line-height: 1.6; }

  .row { display: flex; margin: 3px 0; }
  .row.me { justify-content: flex-end; }
  .row.them { justify-content: flex-start; }
  .bubble {
    max-width: 74%; padding: 9px 13px; border-radius: 16px; font-size: 15px;
    line-height: 1.42; word-wrap: break-word; white-space: pre-wrap;
    box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  }
  .row.them .bubble { background: var(--bubble-them); border: 1px solid var(--line); border-left: 3px solid var(--sender-color, var(--line)); border-bottom-left-radius: 4px; }
  .row.me .bubble { background: var(--bubble-me); color: var(--bubble-me-ink); border-bottom-right-radius: 4px; }
  .meta { font-family: ui-monospace, monospace; font-size: 10px; color: var(--ink-dim); margin: 10px 4px 3px; }
  .meta.me { text-align: right; }
  .meta .sender { color: var(--sender-color, var(--ink-dim)); font-weight: 600; }

  footer {
    position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  form { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 6px 6px 14px; }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 15px; line-height: 1.4; max-height: 120px; padding: 6px 0;
  }
  textarea::placeholder { color: var(--ink-dim); }
  button.send {
    border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12px; letter-spacing: 0.03em; padding: 10px 16px; border-radius: 14px; cursor: pointer; flex-shrink: 0;
  }
  button.send:disabled { opacity: 0.4; cursor: default; }

  /* full-screen views */
  .view {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: none; flex-direction: column;
  }
  .view.active { display: flex; }
  .view-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card {
    max-width: 360px; width: 100%; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 26px 24px; text-align: center;
  }
  .card h2 { font-size: 18px; margin: 0 0 6px; }
  .card p { font-size: 13.5px; color: var(--ink-dim); line-height: 1.5; margin: 0 0 18px; }
  .card input {
    width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-family: inherit; font-size: 15px; margin-bottom: 12px; outline: none;
  }
  .card input:focus { border-color: var(--accent); }
  .card button.primary {
    width: 100%; border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12.5px; letter-spacing: 0.03em; padding: 12px; border-radius: 12px; cursor: pointer;
  }
  .card .switch {
    margin-top: 14px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; text-decoration: underline;
  }
  .card .errormsg { color: var(--accent); font-size: 12.5px; margin: -6px 0 12px; min-height: 1em; }

  /* room list view */
  .rooms-wrap { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .roomlist { display: flex; flex-direction: column; gap: 8px; max-width: 480px; margin: 0 auto; }
  .roomcard {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; cursor: pointer;
  }
  .roomcard:hover { border-color: var(--accent); }
  .roomcard .name { font-size: 15.5px; font-weight: 600; }
  .roomcard .sub { font-size: 11px; color: var(--ink-dim); font-family: ui-monospace, monospace; margin-top: 2px; }
  .roomlist .emptyrooms { text-align: center; color: var(--ink-dim); font-size: 13.5px; padding: 30px 10px; }
  .newroom-row { display: flex; gap: 8px; max-width: 480px; margin: 0 auto 16px; padding: 16px 16px 0; }
  .newroom-row input {
    flex: 1; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); font-family: inherit; font-size: 14.5px; outline: none;
  }
  .newroom-row input:focus { border-color: var(--accent); }
  .newroom-row button {
    border: none; background: var(--accent); color: #fff; font-family: ui-monospace, monospace;
    font-size: 12px; padding: 0 16px; border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  .join-row { max-width: 480px; margin: 10px auto 0; padding: 0 16px; text-align: center; }
  .join-row a { color: var(--ink-dim); font-size: 12px; cursor: pointer; text-decoration: underline; }
  .joinbox-row { display: flex; gap: 8px; max-width: 480px; margin: 6px auto 0; padding: 0 16px; }
  .joinbox-row input {
    flex: 1; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-dim); font-family: ui-monospace, monospace; font-size: 12.5px; outline: none;
  }
  .joinbox-row input:focus { border-color: var(--accent); color: var(--ink); }
  .joinbox-row button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-dim); font-family: ui-monospace, monospace;
    font-size: 11px; padding: 0 14px; border-radius: 12px; cursor: pointer; white-space: nowrap;
  }
  .joinbox-error { max-width: 480px; margin: 4px auto 0; padding: 0 16px; font-size: 11.5px; color: var(--accent); text-align: center; min-height: 1em; }
  .system-line { text-align: center; font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-dim); margin: 12px 4px; }

  .attachbtn {
    border: none; background: transparent; color: var(--ink-dim); font-size: 19px;
    padding: 8px 4px; cursor: pointer; flex-shrink: 0; line-height: 1;
  }
  .attachbtn:hover { color: var(--accent); }
  .attachbtn:disabled { opacity: 0.4; cursor: default; }
  .bubble.imgbubble { padding: 4px; max-width: 68%; }
  .bubble.imgbubble img {
    display: block; width: 100%; max-height: 320px; object-fit: cover;
    border-radius: 12px; cursor: pointer;
  }
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- AUTH VIEW -->
<div class="view active" id="view-auth">
  <div class="view-center">
    <div class="card">
      <h2 id="authTitle">Sign in</h2>
      <p id="authSubtitle">Username and password only — no email. Synced everywhere.</p>
      <div class="errormsg" id="authError"></div>
      <input id="authUsername" type="text" maxlength="24" placeholder="Username" autocomplete="off">
      <input id="authPassword" type="password" maxlength="64" placeholder="Password" autocomplete="off">
      <button class="primary" id="authSubmit">Sign in</button>
      <div class="switch" id="authSwitch">New here? Create an account</div>
    </div>
  </div>
</div>

<!-- ROOM LIST VIEW -->
<div class="view" id="view-rooms">
  <header>
    <h1>Wire</h1>
    <div class="right">
      <span class="status" id="whoami"></span>
      <button class="iconbtn" id="logoutBtn">log out</button>
    </div>
  </header>
  <div class="newroom-row">
    <input id="newRoomName" type="text" maxlength="40" placeholder="Name a new room…" autocomplete="off">
    <button id="createRoomBtn">Create</button>
  </div>
  <div class="rooms-wrap">
    <div class="roomlist" id="roomList"></div>
  </div>
  <div class="join-row"><a id="pendingJoinLink" style="display:none;">Join the room from your link</a></div>
  <div class="joinbox-row">
    <input id="joinCodeInput" type="text" placeholder="Paste a Wire link or room code…" autocomplete="off">
    <button id="joinCodeBtn">Join</button>
  </div>
  <div class="joinbox-error" id="joinCodeError"></div>
</div>

<!-- CHAT VIEW -->
<div class="view" id="view-chat">
  <header>
    <h1 id="chatBack" title="Back to your rooms">Wire</h1>
    <div class="right">
      <span class="status" id="status">—</span>
      <button class="iconbtn" id="shareBtn">copy link</button>
    </div>
  </header>
  <main id="thread">
    <div class="empty" id="emptyState">No messages yet — say something.</div>
  </main>
  <footer>
    <form id="composer">
      <button type="button" class="attachbtn" id="attachBtn" title="Attach an image">📷</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">
      <textarea id="input" rows="1" placeholder="Message" maxlength="2000"></textarea>
      <button class="send" id="send" type="submit">send</button>
    </form>
  </footer>
</div>

<script>
(function () {
  // ---------- Firebase (accounts, room names, and now messages too — all synced, all persistent) ----------
  firebase.initializeApp({
    apiKey: "AIzaSyDCcaLRE6uUmeXpXT60SzagWmCrSn2I1Xc",
    authDomain: "wire-quickchat.firebaseapp.com",
    projectId: "wire-quickchat",
    storageBucket: "wire-quickchat.firebasestorage.app",
    messagingSenderId: "356713301537",
    appId: "1:356713301537:web:4016542978dfd158c68560"
  });
  const firestoreDb = firebase.firestore();
  const accountsCol = firestoreDb.collection('wire-accounts');
  const roomsCol = firestoreDb.collection('wire-rooms');
  const FieldValue = firebase.firestore.FieldValue;
  const IMAGE_BYTE_BUDGET = 700000; // stay safely under Firestore's 1MB-per-document cap

  async function hashPassword(pw) {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // ---------- state ----------
  let currentUser = null;
  let pendingTopicFromLink = getTopicFromHash();

  function getTopicFromHash() {
    const h = location.hash.replace('#', '').trim();
    return h.length > 0 ? h : null;
  }
  function randomTopic() {
    return 'wire-' + Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
  }

  // ---------- view switching ----------
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------- AUTH VIEW ----------
  let authMode = 'signin';
  const authTitle = document.getElementById('authTitle');
  const authSwitch = document.getElementById('authSwitch');
  const authSubmit = document.getElementById('authSubmit');
  const authError = document.getElementById('authError');
  const authUsername = document.getElementById('authUsername');
  const authPassword = document.getElementById('authPassword');

  function setAuthMode(mode) {
    authMode = mode;
    authError.textContent = '';
    if (mode === 'signin') {
      authTitle.textContent = 'Sign in';
      authSubmit.textContent = 'Sign in';
      authSwitch.textContent = 'New here? Create an account';
    } else {
      authTitle.textContent = 'Create account';
      authSubmit.textContent = 'Create account';
      authSwitch.textContent = 'Already have an account? Sign in';
    }
  }
  authSwitch.addEventListener('click', () => setAuthMode(authMode === 'signin' ? 'create' : 'signin'));

  authSubmit.addEventListener('click', async () => {
    const username = authUsername.value.trim();
    const password = authPassword.value;
    authError.textContent = '';
    if (!username || !password) {
      authError.textContent = 'Enter a username and password.';
      return;
    }
    authSubmit.disabled = true;
    authSubmit.textContent = authMode === 'create' ? 'Creating…' : 'Signing in…';
    try {
      const hash = await hashPassword(password);
      const ref = accountsCol.doc(username);
      const snap = await ref.get();
      if (authMode === 'create') {
        if (snap.exists) { authError.textContent = 'That username is already taken.'; return; }
        await ref.set({ passwordHash: hash, rooms: [] });
        currentUser = username;
        enterRoomsView();
      } else {
        if (!snap.exists || snap.data().passwordHash !== hash) { authError.textContent = 'Wrong username or password.'; return; }
        currentUser = username;
        enterRoomsView();
      }
    } catch (e) {
      authError.textContent = 'Could not reach the database — check your connection and try again.';
    } finally {
      authSubmit.disabled = false;
      setAuthMode(authMode);
    }
  });
  authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') authSubmit.click(); });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    if (roomsUnsub) { roomsUnsub(); roomsUnsub = null; }
    currentUser = null;
    myRoomsCache = [];
    authUsername.value = '';
    authPassword.value = '';
    setAuthMode('signin');
    showView('view-auth');
  });

  // ---------- ROOM LIST VIEW ----------
  const whoamiEl = document.getElementById('whoami');
  const roomListEl = document.getElementById('roomList');
  const newRoomNameEl = document.getElementById('newRoomName');
  const pendingJoinLinkEl = document.getElementById('pendingJoinLink');

  let roomsUnsub = null;
  let myRoomsCache = [];

  function getMyRooms() { return myRoomsCache; }

  function subscribeRooms() {
    if (roomsUnsub) { roomsUnsub(); roomsUnsub = null; }
    roomsUnsub = accountsCol.doc(currentUser).onSnapshot((snap) => {
      myRoomsCache = (snap.exists && snap.data().rooms) || [];
      renderRoomList();
    }, () => {});
  }

  async function addRoomToMyList(topic, name) {
    if (myRoomsCache.some(r => r.id === topic)) return;
    try {
      await accountsCol.doc(currentUser).update({
        rooms: FieldValue.arrayUnion({ id: topic, name: name || topic })
      });
    } catch (e) {}
  }

  function renderRoomList() {
    whoamiEl.textContent = currentUser;
    const rooms = getMyRooms();
    roomListEl.innerHTML = '';
    if (rooms.length === 0) {
      roomListEl.innerHTML = '<div class="emptyrooms">No rooms yet — name one above to start, or open a Wire link someone sent you.</div>';
    } else {
      rooms.forEach(r => {
        const card = document.createElement('div');
        card.className = 'roomcard';
        card.innerHTML = '<div><div class="name"></div><div class="sub"></div></div><div class="iconbtn" style="pointer-events:none;">open →</div>';
        card.querySelector('.name').textContent = r.name;
        card.querySelector('.sub').textContent = r.id;
        card.addEventListener('click', () => enterChatView(r.id, r.name));
        roomListEl.appendChild(card);
      });
    }
    if (pendingTopicFromLink && !rooms.some(r => r.id === pendingTopicFromLink)) {
      pendingJoinLinkEl.style.display = 'inline';
      pendingJoinLinkEl.onclick = () => {
        const t = pendingTopicFromLink;
        pendingTopicFromLink = null;
        joinRoomByCodeOrLink(t);
      };
    } else {
      pendingJoinLinkEl.style.display = 'none';
    }
  }

  function extractTopicFromInput(raw) {
    let v = (raw || '').trim();
    if (!v) return null;
    if (v.includes('#')) v = v.split('#').pop();
    return v.trim() || null;
  }

  // room's canonical name and its messages both live in Firestore now — no more
  // relying on a public relay's tagging or retention window for either.
  async function joinRoomByCodeOrLink(rawValue) {
    const topic = extractTopicFromInput(rawValue);
    const errEl = document.getElementById('joinCodeError');
    if (errEl) errEl.textContent = '';
    if (!topic) { if (errEl) errEl.textContent = 'Paste a room link or code first.'; return; }

    const existing = getMyRooms().find(r => r.id === topic);
    if (existing) { enterChatView(existing.id, existing.name); return; }

    if (errEl) errEl.textContent = 'Looking up that room…';
    let name = 'Shared room';
    try {
      const snap = await roomsCol.doc(topic).get();
      if (snap.exists && snap.data().name) name = snap.data().name;
    } catch (e) {}

    await addRoomToMyList(topic, name);
    if (errEl) errEl.textContent = '';
    postJoinMessage(topic, currentUser);
    enterChatView(topic, name);
  }

  document.getElementById('joinCodeBtn').addEventListener('click', () => {
    joinRoomByCodeOrLink(document.getElementById('joinCodeInput').value);
  });
  document.getElementById('joinCodeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('joinCodeBtn').click();
  });

  document.getElementById('createRoomBtn').addEventListener('click', async () => {
    const name = newRoomNameEl.value.trim();
    if (!name) { newRoomNameEl.focus(); return; }
    const topic = randomTopic();
    newRoomNameEl.value = '';
    try { await roomsCol.doc(topic).set({ name: name, createdAt: FieldValue.serverTimestamp() }); } catch (e) {}
    await addRoomToMyList(topic, name);
    enterChatView(topic, name);
  });
  newRoomNameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('createRoomBtn').click(); });

  function enterRoomsView() {
    location.hash = '';
    showView('view-rooms');
    subscribeRooms();
  }
  document.getElementById('chatBack').addEventListener('click', () => enterRoomsView());

  // ---------- CHAT VIEW (Firestore messages subcollection — persists indefinitely) ----------
  const threadEl = document.getElementById('thread');
  const emptyEl = document.getElementById('emptyState');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const shareBtn = document.getElementById('shareBtn');

  let topic = null;
  let roomName = '';
  let msgsUnsub = null;
  const renderedIds = new Set();

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function fmtTime(tsField) {
    try {
      const d = tsField && tsField.toDate ? tsField.toDate() : new Date();
      return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch (e) { return ''; }
  }
  const SENDER_PALETTE = ['#b5451b', '#3d6b4f', '#3a5a8c', '#8c5a3a', '#7a4d8c', '#4d8c86', '#a6752f'];
  const senderColors = {};
  function colorForName(name) {
    if (senderColors[name]) return senderColors[name];
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    const color = SENDER_PALETTE[hash % SENDER_PALETTE.length];
    senderColors[name] = color;
    return color;
  }
  function renderSystemLine(text) {
    emptyEl.style.display = 'none';
    const line = document.createElement('div');
    line.className = 'system-line';
    line.textContent = text;
    threadEl.appendChild(line);
  }
  function renderMessageDoc(id, data) {
    if (renderedIds.has(id)) return;
    renderedIds.add(id);
    emptyEl.style.display = 'none';

    if (data.type === 'join') {
      const who = data.sender === currentUser ? 'you' : data.sender;
      renderSystemLine(who + ' joined the wire');
      return;
    }

    const isMe = data.sender === currentUser;
    const row = document.createElement('div');
    row.className = 'row ' + (isMe ? 'me' : 'them');
    const bubble = document.createElement('div');

    if (data.type === 'image' && data.imageData) {
      bubble.className = 'bubble imgbubble';
      const img = document.createElement('img');
      img.src = data.imageData;
      img.loading = 'lazy';
      img.alt = 'shared image';
      img.addEventListener('click', () => window.open(data.imageData, '_blank'));
      bubble.appendChild(img);
    } else {
      bubble.className = 'bubble';
      bubble.textContent = data.text || '';
    }
    if (!isMe) bubble.style.setProperty('--sender-color', colorForName(data.sender));
    row.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'meta' + (isMe ? ' me' : '');
    if (isMe) {
      meta.textContent = 'you · ' + fmtTime(data.ts);
    } else {
      const senderSpan = document.createElement('span');
      senderSpan.className = 'sender';
      senderSpan.style.setProperty('--sender-color', colorForName(data.sender));
      senderSpan.textContent = data.sender;
      meta.appendChild(senderSpan);
      meta.appendChild(document.createTextNode(' · ' + fmtTime(data.ts)));
    }
    threadEl.appendChild(row);
    threadEl.appendChild(meta);
  }

  function setStatus(text) { statusEl.textContent = text; }

  async function sendMessage(text) {
    sendBtn.disabled = true;
    try {
      await roomsCol.doc(topic).collection('messages').add({
        type: 'text',
        sender: currentUser,
        text: text,
        ts: FieldValue.serverTimestamp()
      });
      input.value = '';
      autoGrow();
    } catch (e) {
      setStatus('send failed');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  const attachBtn = document.getElementById('attachBtn');
  const imageInput = document.getElementById('imageInput');

  function readFileAsImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Resizes + compresses down to a byte budget so it fits in one Firestore
  // document (no paid Storage plan needed — the image just rides in the message).
  function compressToBudget(img, maxDim, quality) {
    const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width * scale));
    canvas.height = Math.max(1, Math.round(img.height * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  async function sendImage(file) {
    if (!file) return;
    if (!file.type || file.type.indexOf('image/') !== 0) {
      setStatus('that\'s not an image');
      return;
    }
    attachBtn.disabled = true;
    sendBtn.disabled = true;
    setStatus('preparing image…');
    try {
      const img = await readFileAsImage(file);
      const attempts = [
        [1280, 0.7], [1000, 0.6], [800, 0.5], [600, 0.4], [420, 0.35]
      ];
      let dataUrl = null;
      for (const [maxDim, quality] of attempts) {
        const candidate = compressToBudget(img, maxDim, quality);
        if (candidate.length <= IMAGE_BYTE_BUDGET) { dataUrl = candidate; break; }
        dataUrl = candidate; // keep smallest attempt so far as a fallback
      }
      if (!dataUrl || dataUrl.length > IMAGE_BYTE_BUDGET * 1.4) {
        setStatus('image too complex to shrink enough — try another');
        return;
      }
      setStatus('sending image…');
      await roomsCol.doc(topic).collection('messages').add({
        type: 'image',
        sender: currentUser,
        imageData: dataUrl,
        ts: FieldValue.serverTimestamp()
      });
      setStatus('live');
    } catch (e) {
      setStatus('image upload failed');
    } finally {
      attachBtn.disabled = false;
      sendBtn.disabled = false;
      imageInput.value = '';
    }
  }
  attachBtn.addEventListener('click', () => imageInput.click());
  imageInput.addEventListener('change', () => sendImage(imageInput.files && imageInput.files[0]));

  async function postJoinMessage(forTopic, sender) {
    try {
      await roomsCol.doc(forTopic).collection('messages').add({
        type: 'join', sender: sender, ts: FieldValue.serverTimestamp()
      });
    } catch (e) {}
  }

  function shareLink() { return location.href.split('#')[0] + '#' + topic; }
  shareBtn.addEventListener('click', async () => {
    const link = shareLink();
    try {
      await navigator.clipboard.writeText(link);
      const original = shareBtn.textContent;
      shareBtn.textContent = 'copied';
      setTimeout(() => { shareBtn.textContent = original; }, 1500);
    } catch (e) {
      window.prompt('Copy this link:', link);
    }
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  function enterChatView(t, name) {
    if (msgsUnsub) { msgsUnsub(); msgsUnsub = null; }
    topic = t;
    roomName = name || t;
    location.hash = topic;
    renderedIds.clear();
    threadEl.querySelectorAll('.row, .meta, .system-line').forEach(n => n.remove());
    emptyEl.style.display = '';
    document.getElementById('chatBack').textContent = roomName;
    setStatus('connecting…');
    showView('view-chat');

    msgsUnsub = roomsCol.doc(topic).collection('messages').orderBy('ts', 'asc').limit(500)
      .onSnapshot((snap) => {
        setStatus('live');
        snap.docChanges().forEach((change) => {
          if (change.type === 'added') renderMessageDoc(change.doc.id, change.doc.data());
        });
        threadEl.scrollTop = threadEl.scrollHeight;
      }, () => setStatus('error'));
  }

  // ---------- boot ----------
  setAuthMode('signin');
  authUsername.focus();
})();
</script>
</body>
</html>
